<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AptFinder - 보유세 계산기</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, 'Malgun Gothic', sans-serif; background:#f5f5f5; }
.container { max-width:500px; margin:0 auto; background:#fff; min-height:100vh; }
header { background:#1B3A5C; color:#fff; padding:16px; text-align:center; }
header h1 { font-size:17px; font-weight:600; }
header p { font-size:11px; opacity:0.8; margin-top:2px; }
.form { padding:16px; }
label { font-size:12px; color:#666; display:block; margin-top:12px; }
input, select { width:100%; padding:10px; margin-top:4px; border:1px solid #ddd; border-radius:6px; font-size:13px; }
.btn { width:100%; padding:12px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; margin-top:16px; background:#1B3A5C; color:#fff; }
.result-box { margin:16px; padding:16px; background:#f0f7ff; border-radius:8px; display:none; border:1px solid #d0e0f0; }
.result-box h3 { font-size:14px; color:#1B3A5C; margin-bottom:10px; }
.r-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #eee; font-size:12px; }
.r-row:last-child { border-bottom:none; }
.r-total { display:flex; justify-content:space-between; padding:10px 0; margin-top:8px; border-top:2px solid #1B3A5C; }
.r-total span:first-child { font-size:14px; font-weight:600; color:#1B3A5C; }
.r-total span:last-child { font-size:16px; font-weight:700; color:#e53935; }
.price-display { background:#fff3e0; padding:12px; border-radius:8px; margin-top:12px; display:none; text-align:center; }
.price-display .amount { font-size:22px; font-weight:700; color:#e53935; }
.price-display .label { font-size:11px; color:#666; }
</style>
</head>
<body>
<div class="container">
<header>
<h1>보유세 계산기</h1>
<p>단지 → 동 → 호 선택으로 즉시 계산</p>
</header>

<div class="form">
<label>단지명 검색</label>
<input type="text" id="searchInput" placeholder="예) 은마, 래미안, 미도" oninput="searchComplex()">
<div id="searchResults" style="max-height:150px; overflow-y:auto; border:1px solid #eee; border-radius:6px; margin-top:4px; display:none;"></div>

<label>선택된 단지</label>
<input type="text" id="selectedComplex" readonly style="background:#f9f9f9; color:#1B3A5C; font-weight:600;">

<div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
<div>
<label>동</label>
<select id="dongSelect" onchange="loadHo()">
<option value="">동 선택</option>
</select>
</div>
<div>
<label>호</label>
<select id="hoSelect" onchange="showPrice()">
<option value="">호 선택</option>
</select>
</div>
</div>

<div class="price-display" id="priceDisplay">
<p class="label">공시가격 (2026년 기준)</p>
<p class="amount" id="priceAmount">-</p>
<p style="font-size:11px; color:#666; margin-top:4px;" id="priceDetail"></p>
</div>

<label>주택 수</label>
<select id="houseCount">
<option value="1">1주택</option>
<option value="2">2주택</option>
<option value="3">3주택 이상</option>
</select>

<button class="btn" onclick="calcTax()">보유세 계산하기</button>
</div>

<div class="result-box" id="resultBox">
<h3>📊 보유세 계산 결과</h3>
<div id="resultContent"></div>
</div>

<div style="padding:16px; text-align:center;">
<a href="/" style="font-size:12px; color:#999;">← AptFinder 홈으로</a>
</div>
</div>

<script>
var SUPABASE_URL = 'https://ocfrymsoxqhzzfytdsqr.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9jZnJ5bXNveHFoenpmeXRkc3FyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NzUxNTksImV4cCI6MjEwMTM1MTE1OX0._WAikvSuFjwuSPygNYHd8agTgTGGdVzGyTz4YO1ME3k';
var allData = [];
var selectedPrice = 0;

async function searchComplex() {
  var query = document.getElementById('searchInput').value.trim();
  if (query.length < 2) {
    document.getElementById('searchResults').style.display = 'none';
    return;
  }

  var url = SUPABASE_URL + '/rest/v1/public_prices?complex_name=ilike.*' + encodeURIComponent(query) + '*&select=complex_name,bjdong&limit=100';
  var response = await fetch(url, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
  var data = await response.json();

  // 중복 제거
  var unique = {};
  data.forEach(function(d) { unique[d.complex_name + '|' + d.bjdong] = d; });
  var list = Object.values(unique);

  if (list.length === 0) {
    document.getElementById('searchResults').innerHTML = '<p style="padding:8px; font-size:12px; color:#999;">결과 없음</p>';
    document.getElementById('searchResults').style.display = 'block';
    return;
  }

  var html = '';
  list.forEach(function(item) {
    html += '<div style="padding:8px; border-bottom:1px solid #f0f0f0; cursor:pointer; font-size:12px;" onclick="selectComplex(\'' + item.complex_name + '\',\'' + item.bjdong + '\')">' + item.complex_name + ' <span style="color:#999;">(' + item.bjdong + ')</span></div>';
  });
  document.getElementById('searchResults').innerHTML = html;
  document.getElementById('searchResults').style.display = 'block';
}

async function selectComplex(name, bjdong) {
  document.getElementById('selectedComplex').value = name + ' (' + bjdong + ')';
  document.getElementById('searchResults').style.display = 'none';
  document.getElementById('searchInput').value = '';

  // 해당 단지의 모든 데이터 로드
  var url = SUPABASE_URL + '/rest/v1/public_prices?complex_name=eq.' + encodeURIComponent(name) + '&bjdong=eq.' + encodeURIComponent(bjdong) + '&select=*&order=building_no,unit_no&limit=5000';
  var response = await fetch(url, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
  });
  allData = await response.json();

  // 동 목록 추출
  var dongs = [...new Set(allData.map(d => d.building_no).filter(Boolean))].sort((a,b) => Number(a)-Number(b));
  var dongSelect = document.getElementById('dongSelect');
  dongSelect.innerHTML = '<option value="">동 선택 (' + dongs.length + '개동)</option>';
  dongs.forEach(function(d) {
    dongSelect.innerHTML += '<option value="' + d + '">' + d + '동</option>';
  });

  document.getElementById('hoSelect').innerHTML = '<option value="">호 선택</option>';
  document.getElementById('priceDisplay').style.display = 'none';
  document.getElementById('resultBox').style.display = 'none';
}

function loadHo() {
  var dong = document.getElementById('dongSelect').value;
  if (!dong) return;

  var filtered = allData.filter(d => d.building_no === dong);
  var hoSelect = document.getElementById('hoSelect');
  hoSelect.innerHTML = '<option value="">호 선택 (' + filtered.length + '세대)</option>';
  filtered.forEach(function(d) {
    var priceMan = Math.round(d.price / 10000);
    var priceText = priceMan >= 10000 ? (priceMan/10000).toFixed(1) + '억' : priceMan.toLocaleString() + '만';
    hoSelect.innerHTML += '<option value="' + d.price + '">' + d.unit_no + '호 (' + d.exclusive_area + '㎡) - ' + priceText + '</option>';
  });

  document.getElementById('priceDisplay').style.display = 'none';
  document.getElementById('resultBox').style.display = 'none';
}

function showPrice() {
  var price = Number(document.getElementById('hoSelect').value);
  if (!price) return;
  selectedPrice = price;

  var priceMan = Math.round(price / 10000);
  var priceText = priceMan >= 10000 ? Math.floor(priceMan/10000) + '억 ' + (priceMan%10000 > 0 ? (priceMan%10000).toLocaleString() + '만원' : '원') : priceMan.toLocaleString() + '만원';
  document.getElementById('priceAmount').textContent = priceText;

  var dong = document.getElementById('dongSelect').value;
  var hoText = document.getElementById('hoSelect').selectedOptions[0].text;
  document.getElementById('priceDetail').textContent = document.getElementById('selectedComplex').value + ' ' + dong + '동 ' + hoText.split('(')[0];

  document.getElementById('priceDisplay').style.display = 'block';
}

function calcTax() {
  if (!selectedPrice) { alert('단지 → 동 → 호를 선택해주세요.'); return; }
  var pubPrice = selectedPrice;
  var houseCount = Number(document.getElementById('houseCount').value);

  var fairRatio = 0.6;
  var taxBase = pubPrice * fairRatio;
  var propertyTax = 0;
  if (taxBase <= 60000000) propertyTax = taxBase * 0.001;
  else if (taxBase <= 150000000) propertyTax = 60000 + (taxBase - 60000000) * 0.0015;
  else if (taxBase <= 300000000) propertyTax = 195000 + (taxBase - 150000000) * 0.0025;
  else propertyTax = 570000 + (taxBase - 300000000) * 0.004;

  var eduTax = propertyTax * 0.2;
  var cityTax = taxBase * 0.0014;
  var propertyTotal = propertyTax + eduTax + cityTax;

  var deduction = (houseCount === 1) ? 1200000000 : 900000000;
  var jongbuBase = (pubPrice - deduction) * 0.6;
  if (jongbuBase < 0) jongbuBase = 0;
  var jongbuTax = 0;
  if (jongbuBase > 0) {
    if (houseCount === 1) {
      if (jongbuBase <= 300000000) jongbuTax = jongbuBase * 0.005;
      else if (jongbuBase <= 600000000) jongbuTax = 1500000 + (jongbuBase - 300000000) * 0.007;
      else if (jongbuBase <= 1200000000) jongbuTax = 3600000 + (jongbuBase - 600000000) * 0.01;
      else jongbuTax = 9600000 + (jongbuBase - 1200000000) * 0.014;
    } else {
      if (jongbuBase <= 300000000) jongbuTax = jongbuBase * 0.005;
      else if (jongbuBase <= 600000000) jongbuTax = 1500000 + (jongbuBase - 300000000) * 0.007;
      else if (jongbuBase <= 1200000000) jongbuTax = 3600000 + (jongbuBase - 600000000) * 0.01;
      else if (jongbuBase <= 2500000000) jongbuTax = 9600000 + (jongbuBase - 1200000000) * 0.02;
      else jongbuTax = 35600000 + (jongbuBase - 2500000000) * 0.03;
    }
  }
  var farmTax = jongbuTax * 0.2;
  var jongbuTotal = jongbuTax + farmTax;
  var total = propertyTotal + jongbuTotal;

  var html = '';
  html += '<div class="r-row"><span>공시가격</span><span>' + formatWon(pubPrice) + '</span></div>';
  html += '<div class="r-row"><span>재산세 과세표준 (60%)</span><span>' + formatWon(taxBase) + '</span></div>';
  html += '<div class="r-row"><span>재산세</span><span>' + formatWon(propertyTax) + '</span></div>';
  html += '<div class="r-row"><span>지방교육세 (20%)</span><span>' + formatWon(eduTax) + '</span></div>';
  html += '<div class="r-row"><span>도시지역분 (0.14%)</span><span>' + formatWon(cityTax) + '</span></div>';
  html += '<div class="r-row"><span style="font-weight:600;">재산세 합계</span><span style="font-weight:600;">' + formatWon(propertyTotal) + '</span></div>';
  if (jongbuBase > 0) {
    html += '<div class="r-row" style="margin-top:8px;"><span>종부세 과세표준</span><span>' + formatWon(jongbuBase) + '</span></div>';
    html += '<div class="r-row"><span>종합부동산세</span><span>' + formatWon(jongbuTax) + '</span></div>';
    html += '<div class="r-row"><span>농어촌특별세 (20%)</span><span>' + formatWon(farmTax) + '</span></div>';
    html += '<div class="r-row"><span style="font-weight:600;">종부세 합계</span><span style="font-weight:600;">' + formatWon(jongbuTotal) + '</span></div>';
  } else {
    html += '<div class="r-row" style="margin-top:8px;"><span>종부세</span><span style="color:#43a047;">비과세 (공시가 ' + (houseCount===1?'12':'9') + '억 이하)</span></div>';
  }
  html += '<div class="r-total"><span>총 보유세 (연간)</span><span>' + formatWon(total) + '</span></div>';
  html += '<p style="font-size:10px; color:#999; margin-top:8px;">※ ' + houseCount + '주택 기준 간편 추정치. 장기보유·연령 공제 미반영.</p>';

  document.getElementById('resultContent').innerHTML = html;
  document.getElementById('resultBox').style.display = 'block';
  document.getElementById('resultBox').scrollIntoView({ behavior:'smooth' });
}

function formatWon(amount) {
  amount = Math.round(amount);
  if (amount >= 100000000) {
    var a = Math.floor(amount / 100000000);
    var b = Math.floor((amount % 100000000) / 10000);
    return a + '억' + (b > 0 ? ' ' + b.toLocaleString() + '만원' : '원');
  } else if (amount >= 10000) {
    return Math.floor(amount / 10000).toLocaleString() + '만원';
  }
  return amount.toLocaleString() + '원';
}
</script>
</body>
</html>
