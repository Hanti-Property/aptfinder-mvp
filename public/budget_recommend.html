<style>
*{margin:0;padding:0;box-sizing:border-box}

<body>
<div class="container">
<header>
<div class="badge">AptFinder 분석 모듈</div>
<h1>💰 내 예산에 맞춤 아파트 추천</h1>
<p>강남3구(강남·서초·송파) 아파트를 예산과 조건에 맞춰 분석합니다</p>
</header>
<section id="input-section" class="card">
<h2>📋 조건 입력</h2>
<div class="form-grid">
<div class="form-group full-width">
<label>총 예산 (억 원) <span class="required">*필수</span></label>
<div class="budget-input">
<input type="range" id="budget-slider" min="5" max="80" value="30" step="1">
<div class="budget-display"><input type="number" id="budget-value" value="30" min="5" max="80"> 억 원</div>
</div>
<div class="budget-range-label"><span>5억</span><span>80억</span></div>
</div>
<div class="form-group">
<label>거래 유형 <span class="required">*필수</span></label>
<div class="toggle-group">
<button class="toggle-btn active" data-value="매매" onclick="setTx(this)">매매</button>
<button class="toggle-btn" data-value="전세" onclick="setTx(this)">전세</button>
</div>
</div>
<div class="form-group">
<label>희망 지역</label>
<div class="checkbox-group" id="district-checks">
<label class="checkbox"><input type="checkbox" value="강남구" checked> 강남구</label>
<label class="checkbox"><input type="checkbox" value="서초구" checked> 서초구</label>
<label class="checkbox"><input type="checkbox" value="송파구" checked> 송파구</label>
</div>
</div>
<div class="form-group">
<label>전용면적</label>
<select id="area-select">
<option value="all">전체</option>
<option value="small">59㎡ 이하</option>
<option value="medium">59~84㎡</option>
<option value="large">84~115㎡</option>
<option value="xlarge">115㎡ 이상</option>
</select>
</div>
<div class="form-group">
<label>준공년도</label>
<select id="built-select">
<option value="0">무관</option>
<option value="5">5년 이내 (신축)</option>
<option value="10">10년 이내</option>
<option value="20">20년 이내</option>
</select>
</div>
<div class="form-group">
<label>단지 유형</label>
<div class="checkbox-group" id="type-checks">
<label class="checkbox"><input type="checkbox" value="일반" checked> 일반</label>
<label class="checkbox"><input type="checkbox" value="재건축" checked> 재건축</label>
</div>
</div>
<div class="form-group">
<label>추천 우선순위</label>
<select id="priority-select">
<option value="투자가치">투자가치 우선</option>
<option value="신축">신축·대단지 우선</option>
<option value="재건축">재건축 잠재력 우선</option>
<option value="가성비">가성비 (전세가율) 우선</option>
</select>
</div>
</div>
<button id="recommend-btn" onclick="runRecommendation()">🔍 맞춤 아파트 추천받기</button>
</section>

<section id="result-section" style="display:none">
<div class="result-header"><h2>🏆 추천 결과</h2><p id="result-summary"></p></div>
<div class="comparison-table" id="comparison-table"></div>
<div id="recommendation-cards"></div>
<div class="disclaimer"><p>⚠️ 본 추천은 과거 실거래 데이터 및 공공정보 기반 참고자료이며, 투자 권유가 아닙니다. 실제 투자 판단은 전문가 상담 후 본인 책임하에 결정하시기 바랍니다. 가격 데이터 출처: 국토부 실거래가 공개시스템(시뮬레이션 기준).</p></div>
<div class="cta-section"><p>추천 단지에 대해 더 깊은 분석이 필요하신가요?</p>
<button class="cta-btn" onclick="alert('상담 신청 기능은 실서비스에서 제공됩니다.')">📞 전문가 상담 신청</button></div>
</section>
</div>
<style>

.score-bar{display:inline-block;height:6px;border-radius:3px;background:#0066cc;margin-right:6px;vertical-align:middle}
.rec-card{background:#fff;border-radius:14px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);border-left:4px solid #0066cc;transition:transform .15s}

.rec-card-title{font-size:18px;font-weight:700}

.stat-value.up{color:#e74c3c}
.rec-card-highlight{background:#f8fbff;border-radius:8px;padding:12px 14px;margin-top:12px}

.rec-card-highlight .label{font-size:12px;font-weight:700;color:#0066cc;margin-bottom:4px}

.disclaimer{background:#fffde7;border:1px solid #fff9c4;border-radius:10px;padding:14px 18px;margin:24px 0}

.cta-section{text-align:center;padding:30px 0}

.cta-btn{padding:14px 32px;background:#16a34a;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(22,163,74,.3)}

// ============================================================
const currentYear = 2026;
let txType = "매매";

const slider = document.getElementById('budget-slider');
const budgetInput = document.getElementById('budget-value');
slider.addEventListener('input', () => { budgetInput.value = slider.value; });
budgetInput.addEventListener('input', () => { slider.value = budgetInput.value; });

function setTx(el) {
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  txType = el.dataset.value;
}

function runRecommendation() {
  const budget = parseInt(budgetInput.value) * 100; // 100단위=1억
  const districts = [...document.querySelectorAll('#district-checks input:checked')].map(c=>c.value);
  const areaKey = document.getElementById('area-select').value;
  const builtWithin = parseInt(document.getElementById('built-select').value);
  const types = [...document.querySelectorAll('#type-checks input:checked')].map(c=>c.value);
  const priority = document.getElementById('priority-select').value;

  const areaRanges = {all:[0,999],small:[0,59],medium:[59,84],large:[84,115],xlarge:[115,999]};
  const [aMin,aMax] = areaRanges[areaKey];
  const minBuilt = builtWithin > 0 ? currentYear - builtWithin : 0;

  // 1) 하드 필터
  let list = D.filter(c => {
    if (!districts.includes(c.district)) return false;
    if (!types.includes(c.type)) return false;
    const p = txType==="매매" ? c.price : c.jeonse;
    if (p > budget * 1.05 || p < budget * 0.4) return false;
    if (c.area < aMin || c.area > aMax) return false;
    if (c.built < minBuilt) return false;
    return true;
  });

  // 2) 점수화
  list = list.map(c => {
    const p = txType==="매매" ? c.price : c.jeonse;
    // 가격 적합도 (30점) — 예산에 딱 맞을수록 고점
    const priceFit = Math.max(0, 30 * (1 - Math.abs(budget - p) / budget));
    // 투자가치 (30점) — 3년 상승률 + 재건축 가점
    const growth = ((c.price - c.price3y) / c.price3y) * 100;
    let invest = Math.min(25, growth * 1.0);
    if (c.type==="재건축") invest += 3;
    if (c.recon==="사업시행인가"||c.recon==="관리처분인가") invest += 2;
    invest = Math.min(30, invest);
    // 인프라 (20점) — 세대수 + 신축
    let infra = 0;
    if (c.units>=5000) infra+=10; else if(c.units>=3000) infra+=8; else if(c.units>=1500) infra+=5; else if(c.units>=800) infra+=3; else infra+=1;
    const age = currentYear - c.built;
    if(age<=3) infra+=10; else if(age<=7) infra+=7; else if(age<=15) infra+=4; else infra+=1;
    infra = Math.min(20, infra);
    // 거래안정성 (20점) — 전세가율 + 세대수
    const jr = c.jeonse / c.price;
    let stab = jr > 0.5 ? 14 : jr > 0.42 ? 11 : 8;
    if (c.units>=2000) stab+=4; else if(c.units>=1000) stab+=2;
    stab = Math.min(20, stab);

    let total = priceFit + invest + infra + stab;
    return {...c, priceFit, invest, infra, stab, total, growth};
  });

  // 3) 우선순위 → 배점 재분배 (합계 100점 고정)
  let weights;
  switch(priority) {
    case "투자가치": weights = {pf:20, inv:45, inf:15, st:20}; break;
    case "신축":     weights = {pf:20, inv:15, inf:45, st:20}; break;
    case "재건축":   weights = {pf:20, inv:40, inf:10, st:30}; break;
    case "가성비":   weights = {pf:25, inv:15, inf:15, st:45}; break;
    default:         weights = {pf:30, inv:30, inf:20, st:20};
  }
  list = list.map(c => {
    // 각 지표를 0~1로 정규화 후 가중치 적용
    const normPf = c.priceFit / 30;
    const normInv = c.invest / 30;
    const normInf = c.infra / 20;
    const normSt = c.stab / 20;
    let s = normPf * weights.pf + normInv * weights.inv + normInf * weights.inf + normSt * weights.st;
    // 재건축 우선 시 재건축 단지에 추가 부스트
    if (priority==="재건축" && c.type==="재건축") s += 10;
    return {...c, score: Math.min(99, Math.round(s))};
  });

  // 4) 랭킹
  list.sort((a,b) => b.score - a.score);
  const top = list.slice(0, 10);
  render(top, budget, list.length);
}

function render(results, budget, total) {
  const sec = document.getElementById('result-section');
  sec.style.display = 'block';
  if (!results.length) {
    document.getElementById('result-summary').textContent = '조건에 맞는 단지가 없습니다. 예산이나 조건을 조정해보세요.';
    document.getElementById('comparison-table').innerHTML = '';
    document.getElementById('recommendation-cards').innerHTML = '';
    sec.scrollIntoView({behavior:'smooth'});
    return;
  }
  document.getElementById('result-summary').textContent =
    `예산 ${(budget/100)}억 기준, ${total}개 단지 매칭 → 상위 ${results.length}개 추천`;

  // 비교표
  let t = `<table><thead><tr><th>순위</th><th>단지명</th><th>지역</th><th>면적</th><th>${txType}가</th><th>3년 변동</th><th>세대수</th><th>점수</th></tr></thead><tbody>`;
  results.forEach((r,i) => {
    const rc = i<3 ? `rank-${i+1}` : 'rank-other';
    const pr = txType==="매매" ? r.price : r.jeonse;
    t += `<tr><td><span class="rank-badge ${rc}">${i+1}</span></td>
      <td><strong>${r.name}</strong></td><td>${r.dong}</td><td>${r.area}㎡</td>
      <td>${(pr/100).toFixed(1)}억</td>
      <td style="color:${r.growth>=0?'#e74c3c':'#2980b9'}">${r.growth>=0?'+':''}${r.growth.toFixed(1)}%</td>
      <td>${r.units.toLocaleString()}</td>
      <td><span class="score-bar" style="width:${r.score*0.6}px"></span>${r.score}</td></tr>`;
  });
  t += '</tbody></table>';
  document.getElementById('comparison-table').innerHTML = t;

  // 카드
  let cards = '';
  results.forEach((r,i) => {
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}위`;
    const pr = txType==="매매" ? r.price : r.jeonse;
    const jr = (r.jeonse/r.price*100).toFixed(0);
    let tags = '';
    if (r.type==="재건축") tags += `<span class="tag tag-recon">🏗️ ${r.recon||'재건축'}</span>`;
    if ((currentYear-r.built)<=5) tags += `<span class="tag tag-new">✨ ${r.built}년 신축</span>`;
    if (r.units>=3000) tags += `<span class="tag tag-big">🏘️ ${r.units.toLocaleString()}세대</span>`;
    if (r.jeonse/r.price > 0.48) tags += `<span class="tag tag-value">💎 전세가율 ${jr}%</span>`;

    cards += `<div class="rec-card">
      <div class="rec-card-header">
        <div><div class="rec-card-title">${medal} ${r.name}</div>
        <div class="rec-card-location">${r.district} ${r.dong} | ${r.built}년 준공 | ${r.units.toLocaleString()}세대</div></div>
        <div class="rec-card-score">${r.score}<span style="font-size:13px;color:#888">/100</span></div>
      </div>
      <div class="rec-card-tags">${tags}</div>
      <div class="rec-card-stats">
        <div class="stat-item"><span class="stat-label">💰 ${txType}가</span><span class="stat-value">${(pr/100).toFixed(1)}억</span></div>
        <div class="stat-item"><span class="stat-label">📐 전용면적</span><span class="stat-value">${r.area}㎡</span></div>
        <div class="stat-item"><span class="stat-label">📈 3년 변동</span><span class="stat-value up">${r.growth>=0?'+':''}${r.growth.toFixed(1)}%</span></div>
        <div class="stat-item"><span class="stat-label">🏠 전세가율</span><span class="stat-value">${jr}%</span></div>
        ${r.recon?`<div class="stat-item"><span class="stat-label">🏗️ 재건축</span><span class="stat-value">${r.recon}</span></div>`:''}
      </div>
      <div class="rec-card-highlight"><div class="label">📌 추천 포인트</div><p>${r.highlight}</p></div>
    </div>`;
  });
  document.getElementById('recommendation-cards').innerHTML = cards;
  sec.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
