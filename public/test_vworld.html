<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>V-World API 테스트</title>
</head>
<body>
<h2>V-World 공시가격 API 테스트</h2>
<p>은마아파트 (대치동 316) PNU: 1168010300103160000</p>
<button onclick="testAPI()">조회 테스트</button>
<pre id="result" style="background:#f0f0f0; padding:12px; margin-top:12px;"></pre>

<script>
function testAPI() {
  var pnu = '1168010300103160000';
  var key = '97D0838E-CAEE-382F-A158-79AB81275A03';
  var url = 'https://api.vworld.kr/req/data?service=data&request=GetFeature&data=LP_PA_CBND_BUBUN&key=' + key + '&domain=aptfinder.net&attrFilter=pnu:=:' + pnu + '&type=jsonp&callback=handleResult';

  document.getElementById('result').textContent = '조회 중...';

  var script = document.createElement('script');
  script.src = url;
  document.body.appendChild(script);
}

function handleResult(data) {
  document.getElementById('result').textContent = JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
